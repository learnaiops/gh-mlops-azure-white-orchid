trigger: none

pool: "blue-moon-hub-linux"

variables:
  resourceGroup: "rg-white-orchid-8bx7s6"
  mlWorkspace: "mlw-white-orchid-8bx7s6"
  modelName: "white-orchid-risk-model"
  endpointName: "ep-white-orchid-8bx7s6"
  deploymentName: "dp-white-orchid-8bx7s6"
  mlDir: "$(System.DefaultWorkingDirectory)/machinelearning/white-orchid"

stages:
  - stage: TrainModel
    displayName: "Train & Register Model"
    jobs:
      - job: TrainRegister
        displayName: "Submit AML training job and register model"
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Train on cpu-cluster and register model"
            inputs:
              azureSubscription: "sp-blue-moon"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -e
                az extension add -n ml -y

                # Submit training job (train.py enforces AUC >= 0.80 — job fails if gate not met)
                cd $(mlDir)
                JOB_NAME=$(az ml job create \
                  --resource-group $(resourceGroup) \
                  --workspace-name $(mlWorkspace) \
                  --file train-job.yml \
                  --query name -o tsv)
                echo "Submitted training job: $JOB_NAME"
                echo "##vso[task.setvariable variable=JOB_NAME;isOutput=true]$JOB_NAME"

                # Stream logs and block until complete
                az ml job stream \
                  --resource-group $(resourceGroup) \
                  --workspace-name $(mlWorkspace) \
                  --name "$JOB_NAME"

                STATUS=$(az ml job show \
                  --resource-group $(resourceGroup) \
                  --workspace-name $(mlWorkspace) \
                  --name "$JOB_NAME" --query status -o tsv)
                echo "Training job status: $STATUS"

                if [ "$STATUS" != "Completed" ]; then
                  echo "##[error]Training job failed (status: $STATUS). AUC quality gate may have blocked deployment."
                  exit 1
                fi

                # Register model from job output artifacts
                az ml model create \
                  --resource-group $(resourceGroup) \
                  --workspace-name $(mlWorkspace) \
                  --name $(modelName) \
                  --path "azureml://jobs/$JOB_NAME/outputs/model_dir" \
                  --type custom_model \
                  --description "Health insurance risk classifier (job: $JOB_NAME)"

                echo "Model registered: $(modelName)"

  - stage: DeployEndpoint
    displayName: "Deploy to Pre-Prod Managed Endpoint"
    dependsOn: TrainModel
    jobs:
      - deployment: Deploy
        displayName: "Create/update managed online endpoint"
        environment: "preprod"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: "Deploy managed online endpoint (Standard_DS2_v2)"
                  inputs:
                    azureSubscription: "sp-blue-moon"
                    scriptType: "bash"
                    scriptLocation: "inlineScript"
                    inlineScript: |
                      set -e
                      az extension add -n ml -y

                      # Get latest registered model version
                      MODEL_VERSION=$(az ml model list \
                        --resource-group $(resourceGroup) \
                        --workspace-name $(mlWorkspace) \
                        --name $(modelName) \
                        --query "[0].version" -o tsv)

                      if [ -z "$MODEL_VERSION" ] || [ "$MODEL_VERSION" = "None" ]; then
                        echo "##[error]Could not retrieve model version"
                        exit 1
                      fi
                      echo "Deploying model version: $MODEL_VERSION"

                      # Create endpoint if it doesn't exist
                      az ml online-endpoint show \
                        --resource-group $(resourceGroup) \
                        --workspace-name $(mlWorkspace) \
                        --name $(endpointName) 2>/dev/null || \
                      az ml online-endpoint create \
                        --resource-group $(resourceGroup) \
                        --workspace-name $(mlWorkspace) \
                        --name $(endpointName) \
                        --auth-mode key

                      # Write deployment YAML inline
                      cat > /tmp/deployment.yml << EOF
                      \$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
                      name: $(deploymentName)
                      endpoint_name: $(endpointName)
                      model: "azureml:$(modelName):$MODEL_VERSION"
                      code_configuration:
                        code: $(System.DefaultWorkingDirectory)/machinelearning/white-orchid
                        scoring_script: score.py
                      environment:
                        conda_file: $(System.DefaultWorkingDirectory)/machinelearning/white-orchid/conda.yml
                        image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
                      instance_type: Standard_D2s_v3
                      instance_count: 1
                      EOF

                      cat /tmp/deployment.yml

                      # Create or update deployment
                      if az ml online-deployment show \
                          --resource-group $(resourceGroup) \
                          --workspace-name $(mlWorkspace) \
                          --endpoint-name $(endpointName) \
                          --name $(deploymentName) &>/dev/null; then
                        echo "Deployment exists — updating"
                        az ml online-deployment update \
                          --resource-group $(resourceGroup) \
                          --workspace-name $(mlWorkspace) \
                          --file /tmp/deployment.yml
                      else
                        echo "Deployment not found — creating"
                        az ml online-deployment create \
                          --resource-group $(resourceGroup) \
                          --workspace-name $(mlWorkspace) \
                          --file /tmp/deployment.yml \
                          --all-traffic
                      fi

                      # Print scoring URI
                      SCORING_URI=$(az ml online-endpoint show \
                        --resource-group $(resourceGroup) \
                        --workspace-name $(mlWorkspace) \
                        --name $(endpointName) \
                        --query scoring_uri -o tsv)
                      echo "Endpoint ready: $SCORING_URI"
